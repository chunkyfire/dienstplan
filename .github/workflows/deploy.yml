name: Ausliefern

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ausliefern
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  seite:
    needs: pruefen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # Independent of the page, so one failing does not hold back the other.
  serverfunktion:
    needs: pruefen
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: echo "::warning::Das Secret SUPABASE_ACCESS_TOKEN fehlt, die Serverfunktion wurde nicht ausgeliefert."
      - if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        uses: actions/checkout@v4
      - if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        uses: oven-sh/setup-bun@v2
      - if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: bun install --frozen-lockfile && bun run build:function
      - if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy dienstplan --project-ref tpbrtxzmxosgxerptkef --no-verify-jwt --use-api
